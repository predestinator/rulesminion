[project]
name = "rulesminion"
version = "0.1.0"
description = "OpenMinion agent that extracts hackathon rules and diffs them over time"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openminion>=0.1.20",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pydantic>=2.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rulesminion = "rulesminion.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rulesminion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits real websites and the configured Gemini model",
]
